[project]
name = "artificial-intelligence-cw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kurei999999", email = "krain.ss@icloud.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.4,<3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
comparison = [
    "torch>=2.15,<3",
]

[project.scripts]
artificial-intelligence-cw = "artificial_intelligence_cw:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
