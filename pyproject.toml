[project]
name = "artificial-intelligence-cw"
version = "0.1.0"
description = "Genetic algorithm and neural network for an eight-legged spider gait"
readme = "README.md"
authors = [
    { name = "Kurei999999", email = "krain.ss@icloud.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.4,<3",
    "matplotlib>=3.9,<4",
    "pandas>=2.3.3,<4",
]

[project.optional-dependencies]
comparison = ["torch>=2.15,<3"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["genetic_algorithm", "neural_network"]

[dependency-groups]
dev = ["artificial-intelligence-cw[test]"]
